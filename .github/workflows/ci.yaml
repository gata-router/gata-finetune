name: CI Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
  push:
    branches:
      - '!main'

permissions: {}

concurrency:
  group: ${{ github.workflow }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    name: "Test Code"

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free Up Space
        id: free-up-space
        run: |
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf $AGENT_TOOLSDIRECTORY

          # https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh
          sudo rm -rf \
            /opt/az \
            /opt/microsoft/powershell \
            /usr/local/aws-sam-cil \
            /usr/local/bin/aliyun \
            /usr/local/bin/azcopy \
            /usr/local/bin/bicep \
            /usr/local/bin/cmake-gui \
            /usr/local/bin/cpack \
            /usr/local/bin/helm \
            /usr/local/bin/hub \
            /usr/local/bin/kubectl \
            /usr/local/bin/minikube \
            /usr/local/bin/node \
            /usr/local/bin/packer \
            /usr/local/bin/pulumi* \
            /usr/local/bin/sam \
            /usr/local/bin/stack \
            /usr/local/bin/terraform \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/heroku \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell || :
          sudo apt purge -y \
            firefox \
            google-chrome-stable \
            microsoft-edge-stable

          # Package cleanup
          sudo apt autoremove --purge -y
          sudo apt-get clean

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        id: uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true

      - name: Install dependencies
        id: dependencies
        run: |
          uv sync --frozen

      - name: Formatting
        id: formatting
        run: ruff format --check

      - name: Lint
        id: lint
        run: ruff check

      - name: Type Checking
        id: types
        run: ty check

      - name: Run Tests
        id: run-tests
        run: coverage run -m pytest

      - name: Coverage Report
        id: coverage
        run: coverage report --show-missing

  docker:
    name: "Test Docker Build"

    runs-on: ubuntu-24.04

    needs: test

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free Up Space
        id: free-up-space
        run: |
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf $AGENT_TOOLSDIRECTORY

          # https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh
          sudo rm -rf \
            /opt/az \
            /opt/microsoft/powershell \
            /usr/local/aws-sam-cil \
            /usr/local/bin/aliyun \
            /usr/local/bin/azcopy \
            /usr/local/bin/bicep \
            /usr/local/bin/cmake-gui \
            /usr/local/bin/cpack \
            /usr/local/bin/helm \
            /usr/local/bin/hub \
            /usr/local/bin/kubectl \
            /usr/local/bin/minikube \
            /usr/local/bin/node \
            /usr/local/bin/packer \
            /usr/local/bin/pulumi* \
            /usr/local/bin/sam \
            /usr/local/bin/stack \
            /usr/local/bin/terraform \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/heroku \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell || :
          sudo apt purge -y \
            firefox \
            google-chrome-stable \
            microsoft-edge-stable

          # Package cleanup
          sudo apt autoremove --purge -y
          sudo apt-get clean

      - name: Build Image
        id: build
        run: docker build -t ci-build .

      - name: End-to-end smoke test
        id: test
        # Run inside the built image: the real bert-base-uncased is already baked
        # in, and HF_HUB_OFFLINE keeps it off the network so we never add a second
        # (rate-limited) Hub download.
        run: docker run --rm -e HF_HUB_OFFLINE=1 ci-build /app/test.py

      - name: Docker Cleanup
        id: docker-cleanup
        run: |
          docker system prune -f
          df -h
